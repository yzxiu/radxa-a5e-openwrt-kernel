name: Build A5E OpenWrt Kernel

# 触发方式：
#   1) 手动 dispatch：可选填 kernel_ref（上游 linux-aw2607 的分支/tag/sha），
#      不填默认 main
#   2) push：改 configs/** / patches/** / scripts/** / workflow 时自动构建
#   3) 打 v* tag：release job 会把产物 attach 到 GitHub Release

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'linux-aw2607 ref (branch / tag / sha)'
        required: false
        default: 'main'
  push:
    branches: [main]
    paths:
      - 'configs/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  create:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 上游构建逻辑（debian/patches、Makefile.extra、submodule pin 的 sha）锁定到 fork；
  # 防 radxa-pkg 强推 / 改构建方式把 Actions 打挂。submodule 仍按本仓库 pin 的
  # commit sha checkout，即使 radxa 移动 branch 也不受影响。
  KERNEL_URL: https://github.com/yzxiu/linux-aw2607.git
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: build (kernel ${{ inputs.kernel_ref || 'main' }})
    runs-on: ubuntu-24.04
    # 与本地 rsdk devcontainer 同款 Debian 12（bookworm），
    # 避免 Ubuntu 24.04 deb822 sources 里 arm64 URIs 缺失导致的
    # `crossbuild-essential-arm64` / `libssl-dev:arm64` 装不上问题。
    container:
      image: debian:bookworm
    timeout-minutes: 75
    steps:
      - name: show apt/env (方便日志定位)
        run: |
          set -x
          dpkg --print-architecture
          dpkg --print-foreign-architectures
          echo "--- sources ---"
          cat /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          cat /etc/apt/sources.list 2>/dev/null || true
          echo "--- policy ---"
          apt-cache policy | head -20

      - name: apt base + ca-certificates
        run: |
          set -x
          apt-get update -o Acquire::Retries=5 -o Acquire::ForceIPv4=true 2>&1 | tee /tmp/apt-update.log | tail -20
          apt-get install -y --no-install-recommends ca-certificates git xz-utils 2>&1 | tee /tmp/apt-base.log | tail -10
          if [ ! -x /usr/bin/git ]; then
            echo "::error::git 没装上，失败！"
            cat /tmp/apt-update.log /tmp/apt-base.log
            tail -80 /var/log/apt/term.log 2>/dev/null || true
            exit 1
          fi

      - name: enable arm64 arch
        run: |
          set -x
          dpkg --add-architecture arm64
          apt-get update -o Acquire::Retries=5 -o Acquire::ForceIPv4=true 2>&1 | tail -20

      - name: apt host toolchain (amd64) + cross compiler (arm64)
        run: |
          set -x
          apt-get install -y --no-install-recommends \
            build-essential bc bison flex rsync cpio kmod \
            libssl-dev libncurses-dev libelf-dev \
            dpkg-dev debhelper \
            crossbuild-essential-arm64 \
            qemu-user-static binfmt-support 2>&1 | tail -30
          command -v aarch64-linux-gnu-gcc || { echo "::error::交叉编译器没装上"; exit 1; }

      - name: apt libssl-dev:arm64 (host tools 用交叉编译器编译 extract-cert 需要)
        run: |
          set -x
          apt-get install -y --no-install-recommends libssl-dev:arm64 2>&1 | tail -10
          ls -l /usr/include/aarch64-linux-gnu/openssl/opensslconf.h

      # checkout 之前先把 git safe.directory 配好（Actions workspace 的 uid 与容器 root 不同）
      - name: allow git in workspace
        run: git config --system --add safe.directory '*'

      - name: checkout this repo
        uses: actions/checkout@v4

      - name: cache linux-aw2607 source (submodule)
        uses: actions/cache@v4
        with:
          path: kernel
          # cache key 由本仓库配置 + 上游 ref + scripts 共同决定。
          # 加入 scripts/**：URL/构建脚本改动会让 key 变，强制重建，
          # 避免 fork 后 commit sha 与上游相同导致旧 clone 被误复用、改了等于没改。
          key: kernel-src-${{ inputs.kernel_ref || 'main' }}-${{ hashFiles('configs/**', 'patches/**', 'scripts/**') }}
          restore-keys: |
            kernel-src-${{ inputs.kernel_ref || 'main' }}-
            kernel-src-main-
          # 即使后续步骤失败也保存已编译 objects，下次命中增量（省 25 分钟全量重编）
          save-always: true

      - name: build kernel (clone + patch + fragment + make)
        env:
          KERNEL_REF: ${{ inputs.kernel_ref || 'main' }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: post-process (.ko.xz → .ko, plain Image, sha256)
        run: ./scripts/post-process.sh

      - name: verify (bridge + fw4 + tproxy 都进 vmlinux)
        run: ./scripts/verify.sh

      # BUILD_INFO.env 由 post-process.sh 末尾生成（用 Actions 自动注入的 GITHUB_*
      # + :- 兜底）。不再单设 collect step：之前那个独立 step 里 step-env 引用
      # inputs.kernel_ref 在 push 事件下的渲染会导致该步 exit 1。

      - name: upload artifact — full prepared bundle
        uses: actions/upload-artifact@v4
        with:
          name: a5e-kernel-${{ github.run_number }}
          path: |
            out/linux-image-*.deb
            out/linux-headers-*.deb
            out/linux-libc-dev-*.deb
            out/vmlinuz
            out/root/lib/modules/
            out/root/usr/lib/linux-image-*/
            out/sha256sums.txt
            out/BUILD_INFO.env
          retention-days: 60
          if-no-files-found: error

  # 构建成功后发 Release：
  #   · 打 v* tag           → 正式 release（用 tag 名）
  #   · push main / dispatch → 滚动 prerelease "dev-build"（每次覆盖产物、
  #     target 移到最新 commit，下载它永远是最新 main 构建）
  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: a5e-kernel-${{ github.run_number }}
          path: bundle/

      - name: flatten (把 vmlinuz / deb / sha256 提到顶层方便 release)
        run: |
          set -euo pipefail
          mkdir -p dist
          cp bundle/linux-image-*.deb dist/
          cp bundle/linux-headers-*.deb dist/ 2>/dev/null || true
          cp bundle/linux-libc-dev_*.deb dist/ 2>/dev/null || true
          KVER=$(ls bundle/root/lib/modules/ | head -1)
          cp bundle/vmlinuz "dist/vmlinuz-$KVER"
          cp bundle/sha256sums.txt dist/
          cp bundle/BUILD_INFO.env dist/
          tar -C bundle -cf dist/modules-and-dtb.tar \
            "root/lib/modules" "root/usr/lib/linux-image-$KVER"
          ls -lh dist/

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # release job 没 checkout、工作目录无 .git；gh 默认从 git remote 推断仓库，
          # 会报 “not a git repository”。显式给 GH_REPO 绑定目标仓库。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          KVER=$(ls bundle/root/lib/modules/ | head -1)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"; TITLE="A5E kernel $GITHUB_REF_NAME"; EXTRA=""
          else
            TAG="dev-build"; TITLE="A5E kernel dev-build ($KVER)"; EXTRA="--prerelease"
          fi
          NOTES="**Automated build** from commit \`${GITHUB_SHA}\` (run #${GITHUB_RUN_NUMBER})

          产物：
          - linux-image-*.deb — bridge / firewall4 / tproxy 已 builtin（进 vmlinux，不走 modprobe）
          - vmlinuz-$KVER — 未压缩 ARM64 Image，U-Boot extlinux 直接可用
          - modules-and-dtb.tar — 处理后 /lib/modules(.ko) + /usr/lib/linux-image(dtb)，.bin 已删
          - BUILD_INFO.env / sha256sums.txt — 元数据与校验和"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在（滚动的 dev-build）：覆盖产物，把 target 移到本次 commit
            gh release upload "$TAG" dist/* --clobber
            [[ "${GITHUB_REF}" != refs/tags/* ]] && gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE"
            echo "updated existing release: $TAG"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TITLE" $EXTRA --notes "$NOTES"
            echo "created release: $TAG"
          fi
